name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Install test-only tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nginx openssl shellcheck
          python3 -m venv /tmp/toastweb-lint
          /tmp/toastweb-lint/bin/pip install -r requirements-dev.txt
      - name: Lint and syntax
        run: |
          /tmp/toastweb-lint/bin/ruff check .
          bash -n install.sh
          shellcheck install.sh
          python3 -m compileall -q toastweb.py tests tools
          node --check tools/capture_preview.mjs
      - name: Non-root unit and isolated Nginx integration tests
        run: |
          test "$(id -u)" -ne 0
          TOASTWEB_LIVE_NGINX=1 /tmp/toastweb-lint/bin/python -m unittest discover -s tests -v
      - name: Root unit and privilege-dropping Nginx integration tests
        run: |
          sudo -u root sh -c 'test "$(id -u)" -eq 0'
          sudo -u root env TOASTWEB_LIVE_NGINX=1 /tmp/toastweb-lint/bin/python -m unittest discover -s tests -v
      - name: Confirm plan is non-mutating
        run: >-
          python3 toastweb.py plan
          --domain notes.example.org --email ops@example.org
